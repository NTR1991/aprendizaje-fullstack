<!DOCTYPE html>
<html>
<head>
    <title>Tabla de multiplicar</title>
</head>
<body>
    <h1>Tabla de multiplicar</h1>
    
    <script>
        let numero = parseInt(prompt("Introduce un número:"));
        
        for(let i = 1; i <= 10; i++) {
            let resultado = numero * i;
            console.log(numero + " multiplicado por " + i + " es igual a " + resultado);
        }
    </script>
</body>
</html>
