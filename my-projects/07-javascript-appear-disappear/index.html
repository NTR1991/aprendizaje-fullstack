<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aparecer / Desaparecer</title>
</head>
<body>
    <h2>¿Qué podemos hacer con JavaScript?</h2>
    <p id="demo">Practicando JavaScript</p>
    <button type="button" onclick="document.getElementById('demo').style.display='none'">Desaparecer!</button>
    <button type="button" onclick="document.getElementById('demo').style.display='block'">Aparecer!</button>
</body>
</html>
